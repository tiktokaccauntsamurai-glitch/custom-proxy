[package]
name = "cproxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = { version = "0.4", features = ["std"] }
core-model = { path = "../core-model" }
fmt-shadowrocket = { path = "../fmt-shadowrocket" }
fmt-nodes = { path = "../fmt-nodes" }
singbox-gen = { path = "../singbox-gen" }
supervisor = { path = "../supervisor" }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Режим сервера (cli/src/server.rs): проверка сайта-маски REALITY. Те же крейты, что уже тянет ureq.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "1"
# QR-код ссылки для Shadowrocket в терминал (решение пользователя, SERVER-QUESTIONS E2).
qrcode = { version = "0.14", default-features = false }
# phone-conf: экранирование имён в policy-regex-filter (тот же крейт, что в singbox-gen).
fancy-regex = "0.14"
