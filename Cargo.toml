[workspace]
resolver = "2"
members = ["crates/core-model", "crates/fmt-shadowrocket", "crates/fmt-nodes", "crates/singbox-gen", "crates/supervisor", "crates/cli"]

[workspace.package]
version = "0.1.0-dev"
